<title>CRICVIBE | Stay Connected. Stay Live.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at top,#24365a 0,#101a35 42%,#080e20 100%);font-family:Arial,Helvetica,sans-serif;color:#fff;display:flex;justify-content:center;align-items:center;padding:24px 14px}
.page{width:100%;max-width:520px;border:2px solid #e9c96b;border-radius:42px;padding:32px 24px 28px;background:linear-gradient(160deg,#18294c 0%,#101a35 100%);box-shadow:0 0 28px rgba(233,201,107,.12);text-align:center}
.brand{font-size:clamp(34px,9vw,54px);font-weight:900;letter-spacing:1px;color:#f1d58a;text-shadow:0 2px 12px #0005}
.tagline{margin-top:10px;color:#d6d9e4;font-size:12px;letter-spacing:4px;font-weight:700}
.logo-wrap{margin:28px auto 24px;width:150px;height:150px;border:3px solid #e9c96b;border-radius:24px;padding:5px;background:#0b142b;overflow:hidden;box-shadow:0 0 20px #e9c96b22}
.logo-wrap img{width:100%;height:100%;object-fit:cover;border-radius:17px}
.pills{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.pill{padding:14px 22px;border-radius:30px;font-weight:800;font-size:15px;background:#263a62;color:#f4d88f;border:1px solid #c9ad5e}
.pill.gold{background:#e9c96b;color:#17213a;border-color:#f5dfa0}
.join{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:72px;border-radius:22px;background:linear-gradient(135deg,#f4d98e,#dcb64e);border:2px solid #fff0bd;color:#101a35;text-decoration:none;font-size:clamp(20px,5vw,27px);font-weight:900;box-shadow:0 8px 22px #0003;transition:transform .18s,filter .18s}
.join:hover{transform:translateY(-2px);filter:brightness(1.05)}
.features{margin-top:22px;display:grid;gap:12px}
.feature{background:#172747;border:1px solid #293b5f;border-radius:17px;padding:17px 18px;text-align:left;font-weight:800;font-size:17px;color:#f5f6fa}
.feature span{margin-right:10px;color:#f0d17a}
.note{margin-top:27px;color:#9daac5;font-size:10px;letter-spacing:3px;line-height:1.8}
@media(max-width:380px){.page{padding:26px 17px;border-radius:30px}.tagline{letter-spacing:2px}.pill{font-size:13px;padding:12px 17px}}
</style>
